services:
  mrv-solution-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mrv-solution-api:latest
    container_name: mrv-solution-api
    restart: unless-stopped
    environment:
      SERVICE_NAME: mrv-solution-api
      SERVICE_VERSION: 0.1.0
      MRV_LLM_API_BASE_URL: ${MRV_LLM_API_BASE_URL:?Set MRV_LLM_API_BASE_URL in .env or the shell environment}
      MRV_LLM_API_TIMEOUT_SECONDS: 180
      MRV_CORS_ALLOW_ORIGINS: ${MRV_CORS_ALLOW_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,null}
      PUBLIC_MRV_API_BASE_URL: /api/mrv-solution
    ports:
      - "127.0.0.1:8031:8000"
    networks:
      default:
      awesome_default:
        aliases:
          - mrv-solution-api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  awesome_default:
    external: true
